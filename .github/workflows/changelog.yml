name: Update CHANGELOG on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: write

env:
  GIT_CHGLOG_DOWNLOAD_URL: "https://github.com/git-chglog/git-chglog/releases/download/v0.15.4/git-chglog_0.15.4_linux_amd64.tar.gz"
  GITHUB_BOT_NAME: "github-actions[bot]"
  GITHUB_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  GIT_MESSAGE: "docs(changelog): Updates CHANGELOG to version "

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Install git-chglog
        run: |
          curl -sSL ${{ env.GIT_CHGLOG_DOWNLOAD_URL }} \
            | tar -xz
          sudo mv git-chglog /usr/local/bin/git-chglog

      - name: Generate CHANGELOG
        run: |
          git-chglog \
            --next-tag "${{ steps.version.outputs.version }}" \
            -o CHANGELOG.md

      - name: Commit CHANGELOG
        run: |
          git add CHANGELOG.md

          if git diff --cached --quiet CHANGELOG.md; then
            echo "No changelog changes"
            exit 0
          fi

          git config user.name "${{ env.GITHUB_BOT_NAME }}"
          git config user.email "${{ env.GITHUB_BOT_EMAIL }}"
          git commit -m "${{ env.GIT_MESSAGE }}${{ steps.version.outputs.version }}"
          git push
